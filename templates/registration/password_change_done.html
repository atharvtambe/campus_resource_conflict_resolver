{% extends "base.html" %}

{% block title %}Password Changed - Campus Resource Conflict Resolver{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 col-lg-5 text-center">
        <div class="card shadow border-0 rounded-3 p-4">
            <div class="card-body">
                <i class="bi bi-shield-check text-success display-1 mb-3"></i>
                <h3 class="fw-bold mb-2">Password Updated!</h3>
                <p class="text-muted mb-4">Your password has been changed successfully. You can now use your new password for future sign-ins.</p>
                <a href="{% url 'dashboard' %}" class="btn btn-primary px-4 py-2 fw-semibold">
                    <i class="bi bi-speedometer2 me-1"></i> Return to Dashboard
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
