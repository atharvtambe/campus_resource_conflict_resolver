{% extends "base.html" %}

{% block title %}Password Changed - Campus Resource Conflict Resolver{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 col-lg-5 text-center">
        <div class="card glass-panel p-4">
            <div class="card-body">
                <div class="d-inline-flex p-3 rounded-circle mb-3" style="background: rgba(16, 185, 129, 0.15); color: var(--accent-emerald);">
                    <i class="bi bi-shield-check display-3"></i>
                </div>
                <h3 class="fw-bold text-white mb-2">Password Updated!</h3>
                <p class="text-secondary mb-4">Your password has been changed successfully. You can now use your new password for future sign-ins.</p>
                <a href="{% url 'dashboard' %}" class="btn btn-gold btn-pill px-4 py-2 fw-semibold">
                    <i class="bi bi-speedometer2 me-1"></i> Return to Dashboard
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
